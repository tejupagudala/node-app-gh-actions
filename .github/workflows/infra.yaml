name: "Terraform CI/CD"

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: terraform-main
  cancel-in-progress: false

jobs:
  terraform:
    name: "Terraform Plan & Apply"
    runs-on: ubuntu-latest

    env:
      AWS_REGION: us-east-2
      IMAGE_NAME: node-app-gh-actions

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v6.1.0
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          audience: sts.amazonaws.com
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: infra-${{ github.run_id }}
          unset-current-credentials: true
          output-env-credentials: true

      - name: Verify AWS Identity
        run: aws sts get-caller-identity

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.15.7

      - name: Show Terraform Version
        run: terraform version
      
      - name: Check AWS credential sources
        run: |
          echo "Available AWS environment variables:"
          env | cut -d= -f1 | grep '^AWS_' | sort
          echo "Caller identity:"
          aws sts get-caller-identity
          
      - name: Terraform Init
        working-directory: terraform
        run: terraform init -input=false -reconfigure -backend-config=vars/test/test.backend.tfvars

      - name: Terraform Format
        working-directory: terraform
        run: terraform fmt -check -recursive

      - name: Terraform Validate
        working-directory: terraform
        run: terraform validate

      - name: Terraform Security Scan
        id: tfsec
        continue-on-error: true
        uses: aquasecurity/tfsec-action@v1.0.0
        with:
          working_directory: terraform
          format: json
          additional_args: "--out /github/workspace/tfsec-results.json"

      - name: Display tfsec findings
        if: always()
        run: |
          ls -la "${{ github.workspace }}"

          if [ -f "${{ github.workspace }}/tfsec-results.json" ]; then
            jq '.results[] | {
              rule_id,
              description,
              severity,
              location
            }' "${{ github.workspace }}/tfsec-results.json"
          else
            echo "tfsec-results.json was not created"
            find "${{ github.workspace }}" -name "*tfsec*" -print
            exit 1
          fi

      - name: Upload tfsec report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tfsec-results
          path: ${{ github.workspace }}/tfsec-results.json

      # - name: Stop when tfsec finds security issues
      #   if: steps.tfsec.outcome == 'failure'
      #   run: |
      #     echo "tfsec found security issues."
      #     exit 1
      - name: Terraform Plan
        working-directory: terraform
        run: |
          terraform plan \
            -input=false \
            -var-file=vars/test/test.tfvars \
            -out=tfplan

      - name: Terraform Apply 
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' 
        working-directory: terraform 
        run: terraform apply -input=false -auto-approve tfplan
