name: "Terraform CI/CD" #test
on:
  push:
    branches:
      - main
  #pull_request:
  #  branches:
  #    - main
  workflow_dispatch:
    inputs:
      name:
        type: choice
        description: which env
        options: 
        - dev
        - test
        - prod
permissions:
    id-token: write
    contents: read

concurrency:
  group: terraform-main
  cancel-in-progress: false

jobs:
  terraform:
    name: "Terraform Plan & Apply"
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    env:
      AWS_REGION: "ap-south-1"

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v1
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-2
          role-session-name: infra-${{ github.run_id }}
          
      - name: Verify AWS Identity
        run: aws sts get-caller-identity

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: 1.3.0


      - name: Terraform Init
        working-directory: terraform
        run: terraform init -backend-config=vars/test/test.backend.tfvars

      - name: Terraform Format
        working-directory: terraform
        run: terraform fmt -check -recursive

      - name: Terraform Validate
        working-directory: terraform
        run: terraform validate

      - name: Terraform Security Scan
        uses: aquasecurity/tfsec-action@v1.0.0
        with:
          working_directory: terraform
          #soft_fail: true  # This option prevents tfsec from failing the pipeline
          format: "json"
          additional_args: "--out tfsec-results.json"

      - name: Terraform Plan
        working-directory: terraform
        run: terraform plan -var-file=vars/test/test.tfvars -out=tfplan

      - name: Terraform Apply
        working-directory: terraform
        run: terraform apply -auto-approve tfplan 

      #- name: Manual Approval
      #  uses: hmarr/auto-approve-action@v2
      #  if: github.event_name == 'pull_request'

