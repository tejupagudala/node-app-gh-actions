name: "Terraform CI/CD"

on:
  push:
    branches:
      - main
    paths:
      - "terraform/**"
      - ".github/workflows/infra.yaml"

  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: terraform-main
  cancel-in-progress: false

jobs:
  terraform:
    name: "Terraform Plan & Apply"
    runs-on: ubuntu-latest

    env:
      AWS_REGION: us-east-2

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v6.1.0
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          audience: sts.amazonaws.com
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: infra-${{ github.run_id }}
          unset-current-credentials: true
          output-env-credentials: true

      - name: Verify AWS Identity
        run: aws sts get-caller-identity

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.15.7

      - name: Show Terraform Version
        run: terraform version
      
      - name: Check AWS credential sources
        run: |
          echo "Available AWS environment variables:"
          env | cut -d= -f1 | grep '^AWS_' | sort
          echo "Caller identity:"
          aws sts get-caller-identity
          
      - name: Terraform Init
        working-directory: terraform
        run: terraform init -input=false -reconfigure -backend-config=vars/test/test.backend.tfvars

      - name: Terraform Format
        working-directory: terraform
        run: terraform fmt -check -recursive

      - name: Terraform Validate
        working-directory: terraform
        run: terraform validate

      - name: Terraform Security Scan
        uses: aquasecurity/tfsec-action@v1.0.0
        with:
          working_directory: terraform
          format: json
          additional_args: "--out tfsec-results.json"
      
      - name: Show tfsec findings
        working-directory: terraform
        run: jq '.results[] | {rule_id, description, severity, location}' tfsec-results.json

      
      - name: Upload tfsec results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tfsec-results
          path: tfsec-results.json

      - name: Terraform Plan
        working-directory: terraform
        run: |
          terraform plan \
            -input=false \
            -var-file=vars/test/test.tfvars \
            -out=tfplan

      - name: Terraform Apply
        working-directory: terraform
        run: terraform apply -input=false -auto-approve tfplan
