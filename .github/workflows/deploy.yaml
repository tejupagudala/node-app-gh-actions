name: Secure Build & Deploy to AWS ECS

on:
  workflow_run:
     workflows:
      - "Terraform CI/CD"
     types:
      - completed
     branches:
      - main
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-2
  ECR_REPOSITORY: node-app
  ECS_CLUSTER: test-node-app
  ECS_SERVICE: test-node-app

jobs:
  security_scan:
    name: Security Scanning
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'

    env:
      SONARQUBE_URL: ${{ secrets.SONARQUBE_URL }}
      SONARQUBE_TOKEN: ${{ secrets.SONARQUBE_TOKEN }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
         ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Run Linter
        continue-on-error: true
        run: npm run lint

      - name: Run Tests
        continue-on-error: true
        run: npm test

      - name: OWASP Dependency Check
        uses: dependency-check/Dependency-Check_Action@main
        continue-on-error: true
        with:
          project: nodejs-app
          path: .
          format: HTML
          out: reports
          args: >
            --failOnCVSS 11

      - name: Trivy Filesystem Scan
        uses: aquasecurity/trivy-action@master
        continue-on-error: true
        with:
          scan-type: fs
          scan-ref: .
          exit-code: "0"
          ignore-unfixed: true
          format: table
          output: trivy-results.txt

      - name: Install SonarQube Scanner
        if: env.SONARQUBE_URL != '' && env.SONARQUBE_TOKEN != ''
        run: |
          curl --fail --location \
            --output sonar-scanner.zip \
            https://binaries.sonarsource.com/Distribution/sonar-scanner-cli/sonar-scanner-cli-5.0.1.3006-linux.zip

          unzip -q sonar-scanner.zip

          echo "$GITHUB_WORKSPACE/sonar-scanner-5.0.1.3006-linux/bin" \
            >> "$GITHUB_PATH"

      - name: SonarQube Analysis
        if: env.SONARQUBE_URL != '' && env.SONARQUBE_TOKEN != ''
        continue-on-error: true
        run: |
          sonar-scanner \
            -Dsonar.host.url="$SONARQUBE_URL" \
            -Dsonar.token="$SONARQUBE_TOKEN" \
            -Dsonar.projectKey=my-nodejs-app

      - name: Upload Security Scan Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-scan-reports
          path: |
            reports/**
            trivy-results.txt
          if-no-files-found: warn

  build_and_push:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: security_scan

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Configure AWS Credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v6.1.0
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          audience: sts.amazonaws.com
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: deploy-${{ github.run_id }}
          unset-current-credentials: true
          output-env-credentials: true

      - name: Verify AWS Identity
        run: aws sts get-caller-identity

      - name: Confirm ECR Repository Exists
        run: aws ecr describe-repositories --repository-names "$ECR_REPOSITORY" --region "$AWS_REGION"

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and Push Docker Image
        env: 
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: | 
          test -n "$ECR_REGISTRY" || {
            echo "ECR_REGISTRY is empty"
            exit 1
          }

          test -n "$ECR_REPOSITORY" || {
            echo "ECR_REPOSITORY is empty"
            exit 1
          }

          test -n "$IMAGE_TAG" || {
            echo "IMAGE_TAG is empty"
            exit 1
          }

          FULL_IMAGE="$ECR_REGISTRY/$ECR_REPOSITORY"

          docker build \
            --tag "$FULL_IMAGE:$IMAGE_TAG" \
            --tag "$FULL_IMAGE:latest" \
            .

          docker push "$FULL_IMAGE:$IMAGE_TAG"
          docker push "$FULL_IMAGE:latest"

  deploy:
    name: Deploy to AWS ECS
    runs-on: ubuntu-latest
    needs: build_and_push

    steps:
      - name: Configure AWS Credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v6.1.0
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          audience: sts.amazonaws.com
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: ecs-deploy-${{ github.run_id }}
          unset-current-credentials: true
          output-env-credentials: true

      - name: Update ECS Service
        run: |
          aws ecs update-service \
            --cluster "$ECS_CLUSTER" \
            --service "$ECS_SERVICE" \
            --force-new-deployment \
            --region "$AWS_REGION"

      - name: Wait for ECS Service Stability
        run: |
          aws ecs wait services-stable \
            --cluster "$ECS_CLUSTER" \
            --services "$ECS_SERVICE" \
            --region "$AWS_REGION"

      - name: Show ECS Service Status
        run: |
          aws ecs describe-services \
            --cluster "$ECS_CLUSTER" \
            --services "$ECS_SERVICE" \
            --region "$AWS_REGION" \
            --query "services[0].{Status:status,Desired:desiredCount,Running:runningCount,Pending:pendingCount}"
